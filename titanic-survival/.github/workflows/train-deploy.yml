
name: Train Register Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train-register-deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_ML_WORKSPACE: ${{ secrets.AZURE_ML_WORKSPACE }}
     
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Submit sweep job
        run: python scripts/model_tuning_submit_job_script.py

      - name: Register best model
        run: |
            SWEEP_JOB_NAME=$(cat sweep_job_name.txt)
            echo "Registering best model from sweep job: $SWEEP_JOB_NAME"

            python scripts/register_best_model.py \
              --sweep_job_name $SWEEP_JOB_NAME

      - name: Deploy model
        run: python scripts/model_deployment_script.py
